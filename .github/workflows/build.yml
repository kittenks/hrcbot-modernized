name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT: hrcbot
  VERSION: 2.0.0

jobs:
  # ---------------------------------------------------------------------------
  # Linux: x86 + x64 in one AMBuild pass (gcc multilib can target both).
  # ---------------------------------------------------------------------------
  build-linux:
    name: Linux (x86 + x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (32-bit and 64-bit)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib libc6-dev-i386 \
            python3 python3-pip git
          python3 -m pip install --upgrade pip
          python3 -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Fetch dependencies
        run: bash build.sh all --setup

      - name: Build
        run: bash build.sh all

      - name: Package Linux binaries
        run: bash package.sh --prebuilt obj-linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrcbot-linux
          path: dist/hrcbot-${{ env.VERSION }}-linux.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows x86: must use the 32-bit MSVC toolchain because the hl2sdk headers
  # use __asm inline assembly that the x64 compiler rejects.
  # ---------------------------------------------------------------------------
  build-windows-x86:
    name: Windows x86
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AMBuild
        run: python -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Fetch dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          if (-not (Test-Path deps\hl2sdk-hl2dm)) {
            git clone --depth 1 -b hl2dm https://github.com/alliedmodders/hl2sdk.git deps\hl2sdk-hl2dm
          }
          if (-not (Test-Path deps\metamod-source)) {
            git clone --depth 1 -b 1.12-dev https://github.com/alliedmodders/metamod-source.git deps\metamod-source
          }

      - name: Build
        run: .\build.bat x86

      - name: Stage x86 DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter hrcbot_mm.dll obj-windows | Select-Object -First 1
          if (-not $dll) { throw "x86 DLL not found" }
          New-Item -ItemType Directory -Force -Path out\addons | Out-Null
          Copy-Item $dll.FullName out\addons\hrcbot_mm.dll
          Write-Host "Staged $($dll.FullName)"

      - name: Upload x86 DLL
        uses: actions/upload-artifact@v4
        with:
          name: hrcbot-windows-x86
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows x64.
  # ---------------------------------------------------------------------------
  build-windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AMBuild
        run: python -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Fetch dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          if (-not (Test-Path deps\hl2sdk-hl2dm)) {
            git clone --depth 1 -b hl2dm https://github.com/alliedmodders/hl2sdk.git deps\hl2sdk-hl2dm
          }
          if (-not (Test-Path deps\metamod-source)) {
            git clone --depth 1 -b 1.12-dev https://github.com/alliedmodders/metamod-source.git deps\metamod-source
          }

      - name: Build
        run: .\build.bat x64

      - name: Stage x64 DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter hrcbot_mm.x64.dll obj-windows | Select-Object -First 1
          if (-not $dll) { throw "x64 DLL not found" }
          New-Item -ItemType Directory -Force -Path out\addons | Out-Null
          Copy-Item $dll.FullName out\addons\hrcbot_mm.x64.dll
          Write-Host "Staged $($dll.FullName)"

      - name: Upload x64 DLL
        uses: actions/upload-artifact@v4
        with:
          name: hrcbot-windows-x64
          path: out/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Merge the two Windows DLLs into one release zip.
  # ---------------------------------------------------------------------------
  package-windows:
    name: Package Windows (x86 + x64)
    needs: [build-windows-x86, build-windows-x64]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download x86 DLL
        uses: actions/download-artifact@v4
        with:
          name: hrcbot-windows-x86
          path: dl-x86

      - name: Download x64 DLL
        uses: actions/download-artifact@v4
        with:
          name: hrcbot-windows-x64
          path: dl-x64

      - name: Stage and zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:VERSION
          $stage = "dist\.stage\hrcbot-$ver"
          New-Item -ItemType Directory -Force -Path "$stage\addons\hrcbot_server_plugin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\docs" | Out-Null
          Copy-Item assets\addons\hrcbot_mm.vdf "$stage\addons\"
          Copy-Item "dl-x86\addons\hrcbot_mm.dll" "$stage\addons\"
          Copy-Item "dl-x64\addons\hrcbot_mm.x64.dll" "$stage\addons\"
          Copy-Item assets\addons\hrcbot_server_plugin\hrcbot_names.txt "$stage\addons\hrcbot_server_plugin\"
          Copy-Item assets\addons\hrcbot_server_plugin\*.hrcbot "$stage\addons\hrcbot_server_plugin\"
          Copy-Item README.md, README.zh-CN.md, LICENCE "$stage\"
          Copy-Item -Recurse docs\original "$stage\docs\"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\hrcbot-$ver-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          Write-Host "Created $zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrcbot-windows
          path: dist/hrcbot-${{ env.VERSION }}-windows.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Source tarball.
  # ---------------------------------------------------------------------------
  source:
    name: Source tarball
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: bash package.sh --source
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrcbot-source
          path: dist/hrcbot-${{ env.VERSION }}-source.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release when a v* tag is pushed.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release (tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, package-windows, source]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/hrcbot-linux/hrcbot-${{ env.VERSION }}-linux.tar.gz
            artifacts/hrcbot-windows/hrcbot-${{ env.VERSION }}-windows.zip
            artifacts/hrcbot-source/hrcbot-${{ env.VERSION }}-source.tar.gz
